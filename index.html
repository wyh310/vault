<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vault · 私人密码保险库</title>
<link rel="stylesheet" href="styles.css?v=36" />
</head>
<body>

<!-- ============ 首次设置主密码 ============ -->
<div class="unlock" id="setupScr" style="display:none">
  <div class="lock-card">
    <div class="lock-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <h2>初始化保险库</h2>
    <p>设置一个主密码。它用于派生加密密钥，<br/><b>遗忘后将无法恢复数据</b>，请牢记。</p>
    <div class="field"><input id="suPw1" type="password" placeholder="设置主密码（至少 8 位）" autocomplete="new-password" /></div>
    <div class="field"><input id="suPw2" type="password" placeholder="再次输入主密码" autocomplete="new-password" /></div>
    <div class="err" id="suErr"></div>
    <button class="unlock-btn" id="suBtn">创建保险库</button>
    <div class="hint">密钥由 PBKDF2(310,000 次) 现场派生，不存储主密码</div>
  </div>
</div>

<!-- ============ 解锁 ============ -->
<div class="unlock" id="unlockScr">
  <div class="lock-card">
    <div class="lock-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.3" r="1.5"/></svg>
    </div>
    <h2>私人保险库</h2>
    <p>输入主密码以解锁你的密码库。<br/>所有数据仅保存在本机，不会上传。</p>
    <div class="field">
      <input id="master" type="password" placeholder="主密码" autocomplete="current-password" />
      <button class="eye" id="eye">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="err" id="err">主密码不正确，请重试。</div>
    <button class="unlock-btn" id="unlockBtn">解 锁</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="width:19px;height:19px"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></div>
      <div><b>Vault</b><span>私人密码库</span></div>
      <button class="sb-toggle" id="sbToggle" title="收起/展开">
        <svg class="ic-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg>
        <svg class="ic-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>
    <nav class="nav" id="nav">
      <button data-view="vault" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18M9 4v16"/></svg>
        <span class="nl">保险库</span> <span class="count" id="cVault">0</span>
      </button>
      <button data-view="fav">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 4 2.3 4.7 5.2.8-3.8 3.6.9 5.1L12 16.5 7.4 18.3l.9-5.1L4.5 9.5l5.2-.8L12 4Z"/></svg>
        <span class="nl">收藏夹</span> <span class="count" id="cFav">0</span>
      </button>
      <button data-view="cats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h9M4 12h9M4 17h9"/><circle cx="18" cy="7" r="1.6"/><circle cx="18" cy="12" r="1.6"/><circle cx="18" cy="17" r="1.6"/></svg>
        <span class="nl">分类管理</span>
      </button>
      <button data-view="trash">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
        <span class="nl">回收站</span> <span class="count" id="cTrash">0</span>
      </button>
      <button data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        <span class="nl">设置</span>
      </button>
    </nav>
    <div class="side-foot">
      <button class="lock-now" id="lockNow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="width:16px;height:16px"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
        <span class="lt">立即锁定</span>
      </button>
    </div>
  </aside>
  <div class="side-mask" id="sideMask"></div>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="cfilter" id="catFilter">
        <button type="button" class="cf-btn" id="cfBtn">
          <svg id="cfIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
          <span id="cfVal">全部</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="cf-menu" id="cfMenu"></div>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input id="search" type="text" placeholder="搜索" />
      </div>
      <div class="spacer"></div>
      <button class="btn-add" id="addBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        <span class="bt">新增条目</span>
      </button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 5 5L20 7"/></svg><span id="toastMsg"></span></div>

<script defer src="config.js?v=14"></script>
<script defer src="crypto.js?v=11"></script>
<script defer src="api.js?v=18"></script>
<script defer src="app.js?v=42"></script>
</body>
</html>
